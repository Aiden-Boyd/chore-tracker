name: ChoreTracker
options:
  bundleIdPrefix: com.newlifemedia
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  ChoreTracker:
    type: application
    platform: iOS
    sources:
      - ChoreTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newlifemedia.choretracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
